name: Test
on: [push, pull_request]
permissions:
  contents: read
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --ignore-scripts
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - if: matrix.node == 24
        run: node bin/ci-ui.js
      - if: always() && matrix.node == 24
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'local-work/artifacts/ui-result.json';
            if (!fs.existsSync(file)) return;
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              head_sha: context.sha, name: 'Browser workflow details',
              status: 'completed', conclusion: result.success ? 'success' : 'failure',
              output: { title: result.success ? 'Browser workflow passed' : 'Browser workflow failed',
                summary: '```text\n' + result.output.slice(-20000) + '\n```' }
            });
      - if: always() && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: ui-checks
          path: local-work/artifacts/ui-*.png
          if-no-files-found: ignore
